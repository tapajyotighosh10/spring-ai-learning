spring.application.name=spring-ai-learning

# Automatically load .env file if present in the project root
spring.config.import=optional:file:.env[.properties]

# ===============================
# Google Gemini Configuration
# ===============================
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# Logging
# logging.level.org.springframework.ai=DEBUG

# ===============================
# PostgreSQL Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spring_ai_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway disabled for now (enable when migration scripts are added)
spring.flyway.enabled=false
